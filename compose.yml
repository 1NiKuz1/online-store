services:
  postgres:
    image: postgres:16
    container_name: online-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_store
    ports:
      - "5432:5432"
    volumes:
      - online_store_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: online-store-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - online_store_minio_data:/data
    command: server /data --console-address ":9001"

  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 minioadmin minioadmin123; do sleep 2; done;
      mc mb --ignore-existing myminio/images;
      mc anonymous set download myminio/images;
      "

  redis:
    image: redis:8.8.2-alpine
    container_name: online-store-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - online_store_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  online_store_postgres_data:
  online_store_minio_data:
  online_store_redis_data:
