services:
  postgres:
    image: postgres:16
    container_name: online-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_store
    ports:
      - "5432:5432"
    volumes:
      - online_store_postgres_data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: online-store-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin123
    volumes:
      - online_store_s3_data:/data

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until mc alias set myrustfs http://rustfs:9000 minioadmin minioadmin123; do sleep 2; done;
      mc mb --ignore-existing myrustfs/images;
      "

  redis:
    image: redis:8.8-alpine
    container_name: online-store-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - online_store_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  online_store_postgres_data:
  online_store_s3_data:
  online_store_redis_data:
